[project]
name = "liveops-agent-platform"
version = "0.1.0"
description = "Playable word game + DuckDB telemetry + SRE agent harness with a 3-layer guardrail conformance suite"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]
# Only needed to REBUILD data/wordlist.tsv. Install with uv (pip was seen to hang on it).
wordlist = ["wordfreq>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# one worker per core; a test FILE stays on one worker because its module fixtures own a temp data dir
addopts = "-q -n auto --dist loadfile"

[tool.setuptools]
packages = []
